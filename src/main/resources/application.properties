# Khong can tao database thu cong: JDBC tu tao DB neu chua co.
# Chi can dien DB_USERNAME, DB_PASSWORD tu may cua ban.
# Neu can doi ten DB, sua DB_NAME (mac dinh fashion_clone_demo).
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:fashion_clone_demo}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&createDatabaseIfNotExist=true
# Điền tài khoản và mật khẩu MySQL của bạn
spring.datasource.username=root
spring.datasource.password=123456

# JDBC tao database demo neu chua co; Hibernate tao bang trong database demo, KHONG dung database goc.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.devtools.restart.enabled=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secret=${JWT_SECRET:change-this-demo-secret-before-production-at-least-32-bytes}
jwt.expiration=86400000

# Khong kem thong tin thanh toan cua chu project goc.
payos.enabled=${PAYOS_ENABLED:false}
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}

# Tu them du lieu mau VAO DB TRONG khi khoi dong (khong ghi de data da co).
app.seed.enabled=${APP_SEED_ENABLED:true}
